<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Motaung — terminal profile banner</title>
  <desc id="desc">A retro terminal-style animated banner for Joshua Motaung's GitHub profile.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#d8a354" stroke-opacity=".055" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="284" fill="#101010" stroke="#d8a354" stroke-width="2" />
  <rect x="20" y="20" width="1160" height="260" fill="url(#scanlines)" />

  <text x="52" y="58" fill="#d8a354" font-family="Courier New, monospace" font-size="18">JOSHUA MOTAUNG // PROFILE README</text>
  <text x="1118" y="58" fill="#d8a354" font-family="Courier New, monospace" font-size="18" text-anchor="end">[ONLINE]</text>

  <path d="M52 78H1148" stroke="#d8a354" stroke-opacity=".6" />

  <text x="52" y="124" fill="#ffb000" font-family="Courier New, monospace" font-size="20">&gt; whoami</text>
  <text x="52" y="158" fill="#f3ead7" font-family="Courier New, monospace" font-size="26">joshua.motaung - Software Engineer</text>

  <text x="52" y="204" fill="#ffb000" font-family="Courier New, monospace" font-size="20">&gt; current_mode</text>
  <text x="242" y="204" fill="#d8a354" font-family="Courier New, monospace" font-size="20">building practical software</text>

  <text x="52" y="246" fill="#ffb000" font-family="Courier New, monospace" font-size="20">&gt; open_projects</text>
  <text x="246" y="246" fill="#f3ead7" font-family="Courier New, monospace" font-size="20">versiontrail / crossbuy / morabaraba</text>
  <rect x="52" y="260" width="12" height="23" fill="#d8a354">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="1118" y="265" fill="#d8a354" font-family="Courier New, monospace" font-size="16" text-anchor="end">click to view projects</text>
</svg>
