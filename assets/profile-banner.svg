<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Motaung, software engineer</title>
  <desc id="desc">An animated terminal that types out who Joshua is, current projects, Morabaraba player numbers and Joshua's values, beside a Morabaraba board where a mill forms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e" />
      <stop offset="1" stop-color="#17130c" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a354" stop-opacity=".9" />
      <stop offset=".5" stop-color="#ffb000" stop-opacity=".35" />
      <stop offset="1" stop-color="#d8a354" stop-opacity=".9" />
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb000" stop-opacity=".16" />
      <stop offset="1" stop-color="#ffb000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0" />
      <stop offset=".5" stop-color="#ffb000" stop-opacity=".05" />
      <stop offset="1" stop-color="#ffb000" stop-opacity="0" />
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ffffff" stroke-opacity=".025" stroke-width="1" />
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="344" rx="14" /></clipPath>

    <!-- Each command types itself out: a clip that widens over the line. -->
    <clipPath id="c1"><rect x="48" y="80" height="30" width="0"><animate attributeName="width" from="0" to="120" begin=".4s" dur=".6s" fill="freeze" /></rect></clipPath>
    <clipPath id="c2"><rect x="48" y="140" height="30" width="0"><animate attributeName="width" from="0" to="220" begin="2s" dur=".8s" fill="freeze" /></rect></clipPath>
    <clipPath id="c3"><rect x="48" y="200" height="30" width="0"><animate attributeName="width" from="0" to="240" begin="3.8s" dur=".8s" fill="freeze" /></rect></clipPath>
    <clipPath id="c4"><rect x="48" y="260" height="30" width="0"><animate attributeName="width" from="0" to="120" begin="5.6s" dur=".6s" fill="freeze" /></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="344" fill="url(#bg)" />
    <rect x="8" y="8" width="1184" height="344" fill="url(#scanlines)" />
    <rect x="8" y="-120" width="1184" height="120" fill="url(#sweep)">
      <animate attributeName="y" values="-120;360" dur="7s" repeatCount="indefinite" />
    </rect>

    <!-- Window bar -->
    <rect x="8" y="8" width="1184" height="44" fill="#ffffff" fill-opacity=".03" />
    <path d="M8 52H1192" stroke="#d8a354" stroke-opacity=".25" />
    <circle cx="36" cy="30" r="6" fill="#e0614f" fill-opacity=".85" />
    <circle cx="56" cy="30" r="6" fill="#e2a93b" fill-opacity=".85" />
    <circle cx="76" cy="30" r="6" fill="#6fbf73" fill-opacity=".85" />
    <text x="600" y="35" fill="#8a7a5c" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" text-anchor="middle">~/joshua-motaung — profile</text>
    <circle cx="1100" cy="30" r="4" fill="#6fbf73">
      <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="30" r="4" fill="none" stroke="#6fbf73">
      <animate attributeName="r" values="4;11" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values=".8;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="1114" y="35" fill="#6fbf73" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14">online</text>

    <!-- Terminal -->
    <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="19">
      <g clip-path="url(#c1)"><text x="48" y="100"><tspan fill="#6fbf73">$</tspan><tspan fill="#ffb000"> whoami</tspan></text></g>
      <text x="72" y="128" fill="#f3ead7" font-size="22" opacity="0">Joshua Motaung<tspan fill="#8a7a5c" font-size="18">  ·  software engineer  ·  CS + ML/AI</tspan>
        <set attributeName="opacity" to="1" begin="1.2s" fill="freeze" />
      </text>

      <g clip-path="url(#c2)"><text x="48" y="160"><tspan fill="#6fbf73">$</tspan><tspan fill="#ffb000"> ls ./building</tspan></text></g>
      <text x="72" y="188" fill="#d8a354" opacity="0">morabaraba.dev<tspan fill="#8a7a5c">  ·  </tspan>flow<tspan fill="#8a7a5c"> (AI agents that apply to jobs)</tspan>
        <set attributeName="opacity" to="1" begin="3s" fill="freeze" />
      </text>

      <g clip-path="url(#c3)"><text x="48" y="220"><tspan fill="#6fbf73">$</tspan><tspan fill="#ffb000"> morabaraba --stats</tspan></text></g>
      <text x="72" y="248" fill="#f3ead7" opacity="0">7,600+<tspan fill="#8a7a5c"> players  ·  </tspan>255k+<tspan fill="#8a7a5c"> matches  ·  </tspan>6.6M<tspan fill="#8a7a5c"> moves</tspan>
        <set attributeName="opacity" to="1" begin="4.8s" fill="freeze" />
      </text>

      <g clip-path="url(#c4)"><text x="48" y="280"><tspan fill="#6fbf73">$</tspan><tspan fill="#ffb000"> values</tspan></text></g>
      <text x="72" y="308" fill="#d8a354" opacity="0">evidence &gt; opinion<tspan fill="#8a7a5c">  ·  </tspan>ship carefully<tspan fill="#8a7a5c">  ·  </tspan>respect users
        <set attributeName="opacity" to="1" begin="6.4s" fill="freeze" />
      </text>

      <text x="48" y="338" opacity="0"><tspan fill="#6fbf73">$</tspan>
        <set attributeName="opacity" to="1" begin="7s" fill="freeze" />
      </text>
      <rect x="66" y="322" width="11" height="20" fill="#ffb000" opacity="0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin="7s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Morabaraba board -->
    <circle cx="970" cy="200" r="190" fill="url(#glow)" />
    <g stroke="#d8a354" stroke-opacity=".5" stroke-width="1.5" fill="none">
      <rect x="850" y="80" width="240" height="240" rx="2" />
      <rect x="890" y="120" width="160" height="160" rx="2" />
      <rect x="930" y="160" width="80" height="80" rx="2" />
      <path d="M970 80V160M970 240V320M850 200H930M1010 200H1090" />
      <path d="M850 80L930 160M1090 80L1010 160M850 320L930 240M1090 320L1010 240" />
    </g>
    <g fill="#d8a354" fill-opacity=".45">
      <circle cx="850" cy="80" r="3" /><circle cx="970" cy="80" r="3" /><circle cx="1090" cy="80" r="3" />
      <circle cx="850" cy="200" r="3" /><circle cx="1090" cy="200" r="3" />
      <circle cx="850" cy="320" r="3" /><circle cx="970" cy="320" r="3" /><circle cx="1090" cy="320" r="3" />
      <circle cx="890" cy="120" r="3" /><circle cx="970" cy="120" r="3" /><circle cx="1050" cy="120" r="3" />
      <circle cx="890" cy="200" r="3" /><circle cx="1050" cy="200" r="3" />
      <circle cx="890" cy="280" r="3" /><circle cx="970" cy="280" r="3" /><circle cx="1050" cy="280" r="3" />
      <circle cx="930" cy="160" r="3" /><circle cx="970" cy="160" r="3" /><circle cx="1010" cy="160" r="3" />
      <circle cx="930" cy="200" r="3" /><circle cx="1010" cy="200" r="3" />
      <circle cx="930" cy="240" r="3" /><circle cx="970" cy="240" r="3" /><circle cx="1010" cy="240" r="3" />
    </g>

    <!-- Pieces are placed in turn, amber against cream. -->
    <g stroke="#0c0c0e" stroke-width="2">
      <circle cx="850" cy="80" r="12" fill="#ffb000" opacity="0"><set attributeName="opacity" to="1" begin="1s" fill="freeze" /></circle>
      <circle cx="1050" cy="200" r="12" fill="#f3ead7" opacity="0"><set attributeName="opacity" to="1" begin="1.8s" fill="freeze" /></circle>
      <circle cx="1090" cy="80" r="12" fill="#ffb000" opacity="0"><set attributeName="opacity" to="1" begin="2.6s" fill="freeze" /></circle>
      <circle cx="930" cy="240" r="12" fill="#f3ead7" opacity="0"><set attributeName="opacity" to="1" begin="3.4s" fill="freeze" /></circle>
      <circle cx="890" cy="280" r="12" fill="#ffb000" opacity="0"><set attributeName="opacity" to="1" begin="4.2s" fill="freeze" /></circle>
      <circle cx="970" cy="120" r="12" fill="#f3ead7" opacity="0"><set attributeName="opacity" to="1" begin="5s" fill="freeze" /></circle>
      <circle cx="1010" cy="160" r="12" fill="#f3ead7" opacity="0"><set attributeName="opacity" to="1" begin="5.6s" fill="freeze" /></circle>
    </g>

    <!-- The third amber piece completes a mill along the top row. -->
    <path d="M850 80H1090" stroke="#ffb000" stroke-width="6" stroke-linecap="round" filter="url(#soft)" opacity="0">
      <animate attributeName="opacity" values="0;.9;.35;.9" keyTimes="0;.2;.6;1" dur="2.4s" begin="6.6s" repeatCount="indefinite" />
    </path>
    <path d="M850 80H1090" stroke="#ffb000" stroke-width="2" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0" begin="6.4s" dur=".5s" fill="freeze" />
    </path>
    <circle cx="970" cy="80" r="12" fill="#ffb000" stroke="#0c0c0e" stroke-width="2" opacity="0">
      <set attributeName="opacity" to="1" begin="6.2s" fill="freeze" />
      <animate attributeName="r" values="18;12" begin="6.2s" dur=".3s" fill="freeze" />
    </circle>
    <text x="970" y="340" fill="#8a7a5c" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" text-anchor="middle" opacity="0">mill formed  ·  morabaraba.dev
      <set attributeName="opacity" to="1" begin="6.9s" fill="freeze" />
    </text>
  </g>

  <rect x="8" y="8" width="1184" height="344" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5" />
</svg>
